<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="particles-container"></div>
    
    <div class="container">
        <div class="card" id="birthday-card">
            <div class="card-front">
                <h1>Happy Birthday</h1>
                <p>To My Beautiful Wife</p>
                <button id="open-btn" class="glow-btn">Tap to Open</button>
            </div>
            
            <div class="card-inside hidden" id="inside-message">
                <h2>My Dearest,</h2>
                <p class="message">
                    Every day with you is a wonderful addition to my life's journey. 
                    Your smile brightens my darkest days, and your love gives me wings. 
                    Wishing you a birthday as beautiful, graceful, and amazing as you are.
                </p>
                <p class="signature">- With all my love -</p>
                <div class="heart-pulse">❤️</div>
            </div>
        </div>
    </div>

    <!-- Confetti Library for Celebratory Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
